<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berita - Pondok Pesantren Darul Fawaid Ilmiyah</title>
<link rel="icon" href="https://i.ibb.co.com/gFWV27xB/DFI-Resolusi.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<style>
  body { padding-bottom: 0; }
  .berita-topbar { position: sticky; top: 0; z-index: 500; background: #fff; box-shadow: var(--shadow-sm); padding: 14px 0; }
  .berita-topbar .container { display: flex; align-items: center; justify-content: space-between; }
  .berita-topbar .brand-link { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--forest); font-size: 0.92rem; }
  .berita-topbar img { width: 38px; height: 38px; border-radius: 50%; }
  .article-wrap { max-width: 820px; margin: 0 auto; padding: 46px 0 80px; }
  .article-card { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 40px; }
  @media (max-width: 575.98px) { .article-card { padding: 24px 18px; } }
  .article-cover { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 30px; box-shadow: var(--shadow-sm); }
  .article-content p { font-size: 1.05rem; line-height: 1.85; color: var(--ink-soft); text-align: justify; margin-bottom: 20px; }
  .article-meta { text-align: center; margin-bottom: 26px; }
  .mini-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
  @media (max-width: 650px) { .mini-gallery { grid-template-columns: 1fr; } }
  .mini-gallery figure { margin: 0; border-radius: var(--radius-sm); overflow: hidden; box-shadow: var(--shadow-sm); }
  .mini-gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; transition: transform .4s; cursor: pointer; }
  .mini-gallery img:hover { transform: scale(1.06); }
  .mini-gallery figcaption { background: var(--forest); color: #fff; font-size: 0.8rem; text-align: center; padding: 10px 8px; }
  .footer { padding: 40px 0 22px; }
</style>
</head>
<body>

<div class="berita-topbar">
  <div class="container">
    <a class="brand-link" href="index.html">
      <img src="https://i.ibb.co.com/gFWV27xB/DFI-Resolusi.png" alt="Logo">
      Kembali ke Beranda
    </a>
    <a href="index.html" class="btn btn-primary" style="padding:10px 18px; font-size:.82rem;"><i class="bi bi-house-door"></i> Home</a>
  </div>
</div>

<div class="container">
  <div class="article-wrap">
    <div id="articleContainer" class="article-card">
      <div class="text-center" style="padding:60px 0;">
        <i class="bi bi-arrow-repeat" style="font-size:2rem; color:var(--forest);"></i>
        <p style="margin-top:14px; color:var(--ink-soft);">Memuat berita...</p>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container text-center">
    <p style="color:rgba(255,255,255,.7); font-size:.85rem;">&copy; 2026 Pondok Pesantren Darul Fawaid Ilmiyah.</p>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close"><i class="bi bi-x-lg"></i></button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="assets/js/berita-data.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const params = new URLSearchParams(window.location.search);
    let currentId = parseInt(params.get('id'), 10);
    if (isNaN(currentId)) currentId = 1;

    const article = newsData[currentId];
    const container = document.getElementById('articleContainer');

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    }

    if (article) {
      document.title = article.title + ' — Pondok Pesantren Darul Fawaid Ilmiyah';

      const photosHtml = article.photos.map(p => `
        <figure>
          <img src="${p.url}" alt="${escapeHtml(p.caption)}" data-photo>
          <figcaption>${escapeHtml(p.caption)}</figcaption>
        </figure>
      `).join('');

      container.innerHTML = `
        <div class="article-meta">
          <span class="news-badge">${escapeHtml(article.category)}</span>
          <h1 style="font-size:clamp(1.4rem,3.6vw,2rem); line-height:1.3; margin:14px 0 10px;">${escapeHtml(article.title)}</h1>
          <p style="color:var(--ink-soft); font-size:.88rem;"><i class="bi bi-calendar3 me-1"></i> Dipublikasikan pada: ${escapeHtml(article.date)}</p>
        </div>
        <img src="${article.cover}" alt="${escapeHtml(article.title)}" class="article-cover">
        <div class="article-content">${article.content}</div>
        <hr style="border-color:var(--line); margin:34px 0;">
        <h4 style="color:var(--forest); margin-bottom:18px;"><i class="bi bi-images me-2"></i>Dokumentasi Kegiatan</h4>
        <div class="mini-gallery">${photosHtml}</div>
      `;

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');
      container.querySelectorAll('[data-photo]').forEach(img => {
        img.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightboxImg.alt = img.alt;
          lightbox.classList.add('open');
        });
      });
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.closest('.lightbox-close')) lightbox.classList.remove('open');
      });

    } else {
      container.innerHTML = `
        <div class="text-center" style="padding:60px 0;">
          <h3 style="color:#c0392b;">404 — Berita Tidak Ditemukan</h3>
          <p style="color:var(--ink-soft); margin:10px 0 24px;">Maaf, artikel yang Anda cari tidak tersedia.</p>
          <a href="index.html" class="btn btn-primary">Kembali ke Beranda</a>
        </div>
      `;
    }
  });
</script>
</body>
</html>
